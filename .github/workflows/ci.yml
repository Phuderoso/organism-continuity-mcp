# CI for organism-continuity-mcp (v0.5 structure).
#
# Pinned 2026-11-19:
#   actions/checkout        v7.0.1  (3d3c42e5aac5ba805825da76410c181273ba90b1)
#   actions/setup-python    v7.1.0  (6d4fd22b20465ccc0f7354476588e8df7c9ca0e0)
#   ruff                    0.17.6
#   pytest                  >=8,<10
#   gitleaks                8.30.1  linux_x64
#                           sha256:551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
#
# Gitleaks is installed from the official release tarball (checksum-verified)
# so a corporate fork does not need a gitleaks-action license. The official
# action (gitleaks/gitleaks-action@v3.0.0, e0c47f4) remains an alternative
# for personal-account repos; organizations need GITLEAKS_LICENSE.

name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install "ruff==0.17.6"
      - name: ruff check
        run: ruff check .

  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: pip install "pytest>=8,<10"
      - name: Tests
        run: |
          set -euo pipefail
          if compgen -G 'tests/test_*.py' > /dev/null || compgen -G 'tests/*_test.py' > /dev/null; then
            python -m pytest -q --tb=short
          else
            echo "No package tests in this tree yet; they arrive with the telepatia kit."
          fi

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          VER=8.30.1
          ARCHIVE="gitleaks_${VER}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VER}/${ARCHIVE}"
          EXPECTED_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL "$URL" -o "$ARCHIVE"
          echo "${EXPECTED_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "$ARCHIVE" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f "$ARCHIVE"
          gitleaks version
      - name: Scan git history
        run: gitleaks detect --source . --verbose --redact --no-banner
