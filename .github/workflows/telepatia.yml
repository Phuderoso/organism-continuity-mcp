# Extra checks for src/organism_continuity/telepatia and src/organism_continuity/handoff.
# ci.yml already runs pytest, ruff and gitleaks; this adds coverage, mypy --strict and
# kit-scoped ruff on the same matrix as ci.yml (Linux and macOS, Python 3.10-3.13; macOS covers
# the kqueue backend). checkout is pinned to the same SHA as ci.yml; setup-uv to its v7.6.0 SHA.
name: telepatia

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telepatia-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: coverage, mypy (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Tests with coverage
        run: uv run pytest -q --cov --cov-fail-under=90
      - name: mypy --strict
        run: uv run mypy --strict -p organism_continuity.telepatia -p organism_continuity.handoff
      - name: ruff (kit only)
        run: uv run ruff check src/organism_continuity tests && uv run ruff format --check src/organism_continuity tests
